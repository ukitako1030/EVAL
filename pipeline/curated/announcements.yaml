# Officially announced (or credibly reported) active-user counts, one metric per series (spec §5.2, §6.2).
#
# Seeded from Epoch AI "AI Companies" usage reports (https://epoch.ai/data/ai_companies_usage_reports.csv,
# CC BY 4.0; fixture pipeline/test/fixtures/epoch-usage/sample.csv): rows with Source type
# "Company disclosure" / "Media report", Confidence Confident / Likely, not "Exclude from graph view".
# Values are recorded exactly as stated. `date` is the date the figure refers to (Epoch's `Date`).
# Points whose metric differs from the series metric are left out (e.g. Meta AI 185M WAU, Gemini 35M DAU,
# OpenAI 350M MAU "All products"), so each series stays one metric.
series:
  chatgpt:
    metric: WAU
    points:
      - { date: 2023-03-25, value: 50000000, url: 'https://cdn.openai.com/pdf/a253471f-8260-40c6-a2cc-aa93fe9f142e/economic-research-chatgpt-usage-paper.pdf', note: 'OpenAI/NBER usage paper, consumer plans (reported 2025-09)' }
      - { date: 2023-09-20, value: 80000000, url: 'https://cdn.openai.com/pdf/a253471f-8260-40c6-a2cc-aa93fe9f142e/economic-research-chatgpt-usage-paper.pdf', note: 'OpenAI/NBER usage paper, consumer plans' }
      - { date: 2023-11-06, value: 100000000, url: 'https://techcrunch.com/2023/11/06/openais-chatgpt-now-has-100-million-weekly-active-users/', note: 'Sam Altman at DevDay 2023' }
      - { date: 2024-03-20, value: 125000000, url: 'https://cdn.openai.com/pdf/a253471f-8260-40c6-a2cc-aa93fe9f142e/economic-research-chatgpt-usage-paper.pdf', note: 'OpenAI/NBER usage paper, consumer plans' }
      - { date: 2024-08-29, value: 200000000, url: 'https://www.axios.com/2024/08/29/openai-chatgpt-200-million-weekly-active-users', note: 'OpenAI statement to Axios' }
      - { date: 2024-10-02, value: 250000000, url: 'https://openai.com/index/scale-the-benefits-of-ai/', note: '"Every week, over 250 million people"' }
      - { date: 2024-12-04, value: 300000000, url: 'https://x.com/OpenAINewsroom/status/1864373399218475440' }
      - { date: 2025-02-20, value: 400000000, url: 'https://www.cnbc.com/2025/02/20/openai-tops-400-million-users-despite-deepseeks-emergence.html', note: 'COO Brad Lightcap to CNBC' }
      - { date: 2025-03-31, value: 500000000, url: 'https://openai.com/index/march-funding-updates/', note: '"500 million people who use ChatGPT every week"' }
      # Epoch's 2025-07-15 row ("ChatGPT 700M WAU", value 770000000) is left out: its value contradicts its own
      # label and OpenAI's 700M figure of 2025-08-04. The NBER paper's 2025-03-13 consumer-plan figure (430M) is
      # dropped in favour of OpenAI's own all-plan statement two weeks later (500M).
      - { date: 2025-08-04, value: 700000000, url: 'https://www.cnbc.com/2025/08/04/openai-chatgpt-700-million-users.html' }
      - { date: 2025-10-06, value: 800000000, url: 'https://techcrunch.com/2025/10/06/sam-altman-says-chatgpt-has-hit-800m-weekly-active-users/', note: 'Sam Altman at DevDay 2025' }
      # media "nears 900M / 1B" reports replaced by OpenAI's own statements
      - { date: 2026-02-27, value: 900000000, url: 'https://openai.com/index/scaling-ai-for-everyone/', note: '"more than 900M weekly active users"' }
      - { date: 2026-08-06, value: 1000000000, url: 'https://openai.com/index/improving-gpt-5-6-sol-in-chatgpt/', note: '"Every week, 1 billion people turn to ChatGPT"' }
      - { date: 2026-10-05, value: 1200000000, url: 'https://openai.com/index/new-chatgpt-ads-format-and-measurement/', note: '"ChatGPT reaches 1.2 billion people each week" (DevDay 2026-09-29 said 1.2B "collective")' }
