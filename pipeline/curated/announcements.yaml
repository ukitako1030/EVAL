# Officially announced (or credibly reported) active-user counts, one metric per series (spec §5.2, §6.2).
#
# Seeded from Epoch AI "AI Companies" usage reports (https://epoch.ai/data/ai_companies_usage_reports.csv,
# CC BY 4.0; fixture pipeline/test/fixtures/epoch-usage/sample.csv): rows with Source type
# "Company disclosure" / "Media report", Confidence Confident / Likely, not "Exclude from graph view".
# Values are recorded exactly as stated. `date` is the date the figure refers to (Epoch's `Date`).
# Points whose metric differs from the series metric are left out (e.g. Meta AI 185M WAU, Gemini 35M DAU,
# OpenAI 350M MAU "All products"), so each series stays one metric.
series:
  chatgpt:
    metric: WAU
    points:
      - { date: 2023-03-25, value: 50000000, url: 'https://cdn.openai.com/pdf/a253471f-8260-40c6-a2cc-aa93fe9f142e/economic-research-chatgpt-usage-paper.pdf', note: 'OpenAI/NBER usage paper, consumer plans (reported 2025-09)' }
      - { date: 2023-09-20, value: 80000000, url: 'https://cdn.openai.com/pdf/a253471f-8260-40c6-a2cc-aa93fe9f142e/economic-research-chatgpt-usage-paper.pdf', note: 'OpenAI/NBER usage paper, consumer plans' }
      - { date: 2024-03-20, value: 125000000, url: 'https://cdn.openai.com/pdf/a253471f-8260-40c6-a2cc-aa93fe9f142e/economic-research-chatgpt-usage-paper.pdf', note: 'OpenAI/NBER usage paper, consumer plans' }
