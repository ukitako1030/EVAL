# Model release months (+ vendor display names) — spec §6.1-6 reconstruction and §6.4 event texts.
#
# `match` is a JavaScript RegExp (flag `i`) tested against the source's model name; the FIRST matching entry
# wins, so specific entries come before general ones (and media entries before LLM entries, e.g. Nano Banana
# before Gemini 2.5 Flash). `release` is the month the model became publicly available (vendor announcement,
# URL in the comment). Entries cover the unit models of the first snapshot of every snapshot-type source
# (Arena text 2023-05-08, legacy 2023-05-22, text_style_control 2024-08-28, t2i 2025-01-05,
# image_edit 2025-06-24, t2v/i2v 2025-08-07, Music Arena 2025-08-31, WebDev 2025-11-12) and headline models.
# Models whose month could not be sourced are left out.
models:
  # ═════════════════════════════ image ═════════════════════════════
  # ── OpenAI ──
