<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI WAR ｜ 電脳銀河 — 電脳戦況モニター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #3de8ff;
  --mag: #ff3df0;
  --amber: #ffc93d;
  --bg: #02030a;
  --panel: rgba(4, 11, 26, .78);
  --line: rgba(90, 210, 255, .22);
  --f-disp: 'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif;
  --f-ui: 'Rajdhani', 'Noto Sans JP', 'Yu Gothic UI', 'Meiryo', sans-serif;
  --f-jp: 'Noto Sans JP', 'Yu Gothic UI', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
  --f-mono: 'Share Tech Mono', 'Consolas', 'Menlo', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #d8f4ff; font-family: var(--f-jp); user-select: none; -webkit-user-select: none; }
button { font-family: inherit; }
#cv { position: fixed; inset: 0; display: block; }
body.glitch #cv { transform: translateX(3px) skewX(-.6deg); }

/* ---------- screen FX overlays ---------- */
#fx-vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 45% 50%, transparent 52%, rgba(0, 0, 4, .62) 100%); z-index: 1; }
#fx-scan { position: fixed; inset: 0; pointer-events: none; z-index: 2; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .16) 0 1px, transparent 1px 3px); opacity: .55; animation: crt 7.3s infinite; }
#fx-scan::after { content: ''; position: absolute; left: 0; right: 0; top: -140px; height: 140px; background: linear-gradient(180deg, transparent, rgba(120, 220, 255, .045), transparent); animation: sweep 6.5s linear infinite; }
@keyframes crt { 0%, 46%, 52%, 82%, 87%, 100% { opacity: .55; } 47% { opacity: .85; } 48% { opacity: .35; } 49% { opacity: .7; } 84% { opacity: .95; } 85% { opacity: .45; } }
@keyframes sweep { to { transform: translateY(calc(100vh + 140px)); } }
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 3; opacity: 0; background: radial-gradient(circle at 45% 45%, var(--c, #3de8ff), transparent 70%); }
#flash.on { animation: flash .75s ease-out; }
@keyframes flash { 0% { opacity: .28; } 100% { opacity: 0; } }
#glitch-band { position: fixed; left: 0; right: 0; height: 26px; top: 40%; pointer-events: none; z-index: 4; opacity: 0;
  background: linear-gradient(90deg, transparent, rgba(61, 232, 255, .25) 20%, rgba(255, 61, 240, .22) 55%, transparent 80%);
  box-shadow: 0 -2px 0 rgba(255, 61, 240, .25), 0 2px 0 rgba(61, 232, 255, .25); }
body.glitch #glitch-band { opacity: 1; transform: translateX(-6px); }

/* ---------- HUD frame ---------- */
.hud { position: absolute; z-index: 10; background: var(--panel); border: 1px solid var(--line);
  box-shadow: inset 0 0 32px rgba(40, 160, 255, .07), 0 12px 40px rgba(0, 0, 0, .5); }
.hud::before { content: ''; position: absolute; inset: -1px; pointer-events: none; --b: var(--cyan);
  background:
    linear-gradient(var(--b), var(--b)) 0 0 / 14px 2px no-repeat,
    linear-gradient(var(--b), var(--b)) 0 0 / 2px 14px no-repeat,
    linear-gradient(var(--b), var(--b)) 100% 0 / 14px 2px no-repeat,
    linear-gradient(var(--b), var(--b)) 100% 0 / 2px 14px no-repeat,
    linear-gradient(var(--b), var(--b)) 0 100% / 14px 2px no-repeat,
    linear-gradient(var(--b), var(--b)) 0 100% / 2px 14px no-repeat,
    linear-gradient(var(--b), var(--b)) 100% 100% / 14px 2px no-repeat,
    linear-gradient(var(--b), var(--b)) 100% 100% / 2px 14px no-repeat; }
.hud::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(120, 220, 255, .025) 0 1px, transparent 1px 4px); }
.hud { animation: hudIn .9s cubic-bezier(.2, .9, .2, 1) both; }
@keyframes hudIn { 0% { opacity: 0; clip-path: inset(0 0 100% 0); } 60% { opacity: 1; } 100% { opacity: 1; clip-path: inset(0 0 0 0); } }

/* ---------- title ---------- */
#title { top: 14px; left: 16px; display: flex; align-items: stretch; gap: 16px; padding: 10px 18px 10px 16px; animation-delay: .9s; }
.t-left { display: flex; flex-direction: column; justify-content: center; }
.logo { position: relative; font: 900 31px/1 var(--f-disp); letter-spacing: .16em; color: #eaffff;
  text-shadow: 0 0 8px rgba(61, 232, 255, .9), 0 0 22px rgba(61, 232, 255, .5), 0 0 44px rgba(255, 61, 240, .3); }
.logo::before, .logo::after { content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; }
.logo::before { color: var(--mag); clip-path: inset(0 0 100% 0); animation: glA 4.7s infinite steps(1); }
.logo::after { color: var(--cyan); clip-path: inset(100% 0 0 0); animation: glB 4.7s infinite steps(1); }
@keyframes glA { 0%, 90%, 100% { clip-path: inset(0 0 100% 0); transform: none; } 91% { clip-path: inset(10% 0 55% 0); transform: translate(-4px, 0); } 93% { clip-path: inset(62% 0 8% 0); transform: translate(3px, 0); } 95% { clip-path: inset(30% 0 40% 0); transform: translate(-2px, 0); } }
@keyframes glB { 0%, 90%, 100% { clip-path: inset(100% 0 0 0); transform: none; } 92% { clip-path: inset(50% 0 20% 0); transform: translate(4px, 0); } 94% { clip-path: inset(5% 0 70% 0); transform: translate(-3px, 0); } }
.sub { margin-top: 7px; font: 700 13px/1 var(--f-jp); letter-spacing: .3em; color: #c4f2ff; white-space: nowrap; }
.sub span { margin-left: 8px; font: 600 8.5px var(--f-disp); letter-spacing: .25em; color: rgba(61, 232, 255, .62); }
.t-date { border-left: 1px solid var(--line); padding-left: 16px; display: flex; flex-direction: column; justify-content: center; }
.t-cap { display: flex; justify-content: space-between; gap: 12px; font: 600 8.5px var(--f-disp); letter-spacing: .3em; color: rgba(61, 232, 255, .72); }
.t-cap b { font: 400 10px var(--f-mono); letter-spacing: .05em; color: rgba(200, 240, 255, .7); }
.digits { margin-top: 3px; min-width: 6.3ch; font: 700 37px/1 var(--f-disp); letter-spacing: .03em; color: #fff;
  text-shadow: 0 0 10px rgba(61, 232, 255, .9), 0 0 26px rgba(61, 232, 255, .45); font-variant-numeric: tabular-nums; }
.digits.tick { animation: digitTick .38s steps(3) 1; }
@keyframes digitTick { 0% { opacity: .25; transform: translateX(3px); color: var(--cyan); } 60% { opacity: 1; transform: translateX(-1px); } 100% { opacity: 1; transform: none; } }

/* ---------- dummy badge ---------- */
#badge { position: absolute; top: 14px; right: 16px; z-index: 12; display: flex; align-items: center; gap: 9px; padding: 7px 14px;
  font: 900 12.5px/1 var(--f-jp); letter-spacing: .08em; color: #ffe08a;
  background: repeating-linear-gradient(-45deg, rgba(255, 201, 61, .17) 0 8px, rgba(255, 201, 61, .04) 8px 16px), rgba(22, 15, 2, .85);
  border: 1px solid rgba(255, 201, 61, .9); box-shadow: 0 0 16px rgba(255, 201, 61, .35), inset 0 0 12px rgba(255, 201, 61, .15);
  text-shadow: 0 0 8px rgba(255, 201, 61, .6); }
#badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .15; } }

/* ---------- back button / hint ---------- */
#back { position: absolute; z-index: 12; top: 106px; left: 16px; padding: 9px 18px 9px 14px; cursor: pointer;
  font: 700 13px var(--f-jp); letter-spacing: .12em; color: #dffaff; background: rgba(61, 232, 255, .12);
  border: 1px solid rgba(61, 232, 255, .7); box-shadow: 0 0 18px rgba(61, 232, 255, .35), inset 0 0 14px rgba(61, 232, 255, .2);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  opacity: 0; transform: translateX(-20px); pointer-events: none; transition: opacity .35s, transform .35s, background .2s; }
#back:hover { background: rgba(61, 232, 255, .28); }
body.focused #back { opacity: 1; transform: none; pointer-events: auto; }
#hint { position: absolute; z-index: 9; top: 40px; left: 640px; white-space: nowrap; pointer-events: none; font: 600 11.5px var(--f-jp); letter-spacing: .14em; color: rgba(160, 235, 255, .75);
  text-shadow: 0 0 8px rgba(61, 232, 255, .6); animation: hintPulse 2.4s ease-in-out infinite; transition: opacity .3s; }
body.focused #hint { opacity: 0; animation: none; }
#hint.nospace { display: none; }
/* 詳細ビューでは告知を左下へ寄せ、拡大した惑星を隠さない */
body.focused #toasts { left: 16px !important; width: 400px !important; transform: none; }
body.focused .t-body { font-size: 15px; }
body.focused .t-en { display: none; }
.t-head { white-space: nowrap; }
@keyframes hintPulse { 50% { opacity: .45; } }

/* ---------- ranking panel ---------- */
#panel { top: 56px; right: 16px; bottom: 86px; width: 316px; display: flex; flex-direction: column; padding: 12px 12px 8px; animation-delay: 1.05s; }
.ph { padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.ph-k { font: 700 11px var(--f-jp); letter-spacing: .22em; color: var(--cyan); }
.ph-k span { margin-left: 6px; font: 600 8px var(--f-disp); letter-spacing: .25em; opacity: .65; }
.ph-row { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
.ph-t { font: 900 22px/1.1 var(--f-jp); color: #fff; text-shadow: 0 0 12px rgba(61, 232, 255, .55); }
.ph-en { font: 600 9px var(--f-disp); letter-spacing: .25em; color: rgba(61, 232, 255, .7); }
.ph-stat { margin-top: 4px; font: 400 11px var(--f-mono); color: rgba(200, 236, 255, .7); letter-spacing: .04em; min-height: 14px; }
.ph-stat b { color: #ff7d93; font-weight: 400; }
.cols { display: grid; grid-template-columns: 26px 1fr 40px; gap: 6px; padding: 0 6px 4px 2px; font: 500 9px var(--f-jp); letter-spacing: .1em; color: rgba(170, 220, 255, .5); }
.cols span:last-child { text-align: right; }
#rank-list { position: relative; flex: 0 0 auto; }
#rank-empty { display: none; padding: 30px 0; text-align: center; font: 500 12px var(--f-jp); color: rgba(170, 220, 255, .45); letter-spacing: .3em; }
.row { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: grid; grid-template-columns: 22px 4px 1fr 40px; grid-template-rows: 19px 19px;
  column-gap: 7px; align-items: center; padding: 3px 6px 3px 2px; will-change: transform, opacity; }
.row::before { content: ''; position: absolute; inset: 2px 0; background: linear-gradient(90deg, var(--c), transparent 75%); opacity: .07; pointer-events: none; }
.row.lead::before { opacity: .2; }
.row .fl { position: absolute; inset: 2px 0; background: linear-gradient(90deg, #fff, var(--c) 30%, transparent 90%); opacity: 0; pointer-events: none; }
.row .rk { grid-row: 1 / 3; font: 700 15px var(--f-disp); color: #9fdcff; text-align: center; }
.row.lead .rk { color: #fff; text-shadow: 0 0 10px var(--c); }
.row .chip { grid-row: 1 / 3; width: 4px; height: 34px; background: var(--c); box-shadow: 0 0 8px var(--c), 0 0 2px #fff; }
.row .nm { grid-column: 3; display: flex; align-items: baseline; gap: 6px; overflow: hidden; white-space: nowrap; }
.row .nm b { font: 700 14.5px var(--f-ui); color: #fff; letter-spacing: .02em; }
.row .nm small { font: 600 10px var(--f-ui); color: rgba(200, 230, 255, .55); letter-spacing: .06em; overflow: hidden; text-overflow: ellipsis; }
.row .dl { grid-column: 4; grid-row: 1; font: 400 11px var(--f-mono); text-align: right; }
.dl.up { color: #3dff9e; text-shadow: 0 0 6px rgba(61, 255, 158, .7); }
.dl.down { color: #ff4d6d; text-shadow: 0 0 6px rgba(255, 77, 109, .6); }
.dl.eq { color: rgba(200, 230, 255, .3); }
.dl.new { color: var(--amber); text-shadow: 0 0 6px rgba(255, 201, 61, .7); }
.row .bars { grid-column: 3 / 5; grid-row: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bar { display: grid; grid-template-columns: auto 1fr 30px; align-items: center; gap: 5px; }
.bar em { font: 500 9px var(--f-jp); font-style: normal; color: rgba(200, 230, 255, .55); }
.bar .tr { position: relative; height: 5px; background: rgba(120, 200, 255, .1); overflow: hidden; }
.bar .tr i { position: absolute; inset: 0; transform-origin: left center; background: var(--c); box-shadow: 0 0 6px var(--c); }
.bar.bc .tr i { background: repeating-linear-gradient(90deg, var(--c) 0 3px, transparent 3px 4px); opacity: .85; }
.bar .v { font: 400 11px var(--f-mono); color: #e8f8ff; text-align: right; }
.sec-h { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font: 700 11px var(--f-jp); letter-spacing: .22em; color: var(--cyan); }
.sec-h span { margin-left: 6px; font: 600 8px var(--f-disp); letter-spacing: .25em; opacity: .65; }
.org-grid { display: grid; grid-template-columns: 8px 1fr repeat(5, 17px) 30px; gap: 5px; align-items: center; }
#org-head { margin: 5px 0 3px; font: 500 9px var(--f-jp); color: rgba(170, 220, 255, .55); }
#org-head span { text-align: center; }
#org-list { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.orow { position: absolute; left: 0; right: 0; top: 0; height: 21px; will-change: transform, opacity; }
.orow .od { width: 7px; height: 7px; background: var(--c); box-shadow: 0 0 6px var(--c); transform: rotate(45deg); }
.orow .on { font: 700 12px var(--f-ui); color: #e9f8ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orow .oc { width: 17px; height: 10px; border: 1px solid rgba(120, 200, 255, .16); background: rgba(120, 200, 255, .03); }
.orow .oc.on { background: var(--c); border-color: var(--c); box-shadow: 0 0 7px var(--c); }
.orow .ofl { font: 400 11px var(--f-mono); color: var(--c); text-align: right; }

/* ---------- legend ---------- */
#legend { left: 16px; bottom: 86px; display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: center; padding: 7px 14px; max-width: calc(100vw - 370px);
  font: 500 11.5px var(--f-jp); color: #cfefff; letter-spacing: .04em; animation-delay: 1.2s; }
.lg { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.lg b { color: #fff; font-weight: 700; }
.ic { width: 14px; height: 14px; flex: 0 0 auto; }
.ic-area { background: conic-gradient(from 200deg, #4c8dff 0 35%, #ff8a4c 35% 62%, #19c37d 62% 100%); border-radius: 50%; box-shadow: 0 0 6px rgba(76, 141, 255, .6); }
.ic-glow { border-radius: 50%; background: radial-gradient(circle, #fff 0 18%, #3de8ff 30%, transparent 70%); box-shadow: 0 0 10px #3de8ff; }
.ic-spark { background: linear-gradient(45deg, transparent 45%, #fff 48% 52%, transparent 55%), linear-gradient(-45deg, transparent 45%, #ff8a4c 48% 52%, transparent 55%), linear-gradient(0deg, transparent 45%, #ffd23f 48% 52%, transparent 55%); filter: drop-shadow(0 0 3px #ffd23f); }
.ic-fleet { width: 12px; height: 10px; background: #4c8dff; clip-path: polygon(100% 50%, 0 0, 25% 50%, 0 100%); filter: drop-shadow(0 0 3px #4c8dff); }

/* ---------- toasts ---------- */
#toasts { position: fixed; bottom: 130px; left: 40%; transform: translateX(-50%); width: 520px; display: flex; flex-direction: column; justify-content: flex-end; gap: 7px; pointer-events: none; z-index: 20; }
.toast { position: relative; overflow: hidden; padding: 8px 16px 10px 18px;
  background: linear-gradient(90deg, rgba(3, 9, 22, .94), rgba(3, 9, 22, .78)); border: 1px solid var(--c); border-left: 5px solid var(--c);
  box-shadow: 0 0 26px -4px var(--c), inset 0 0 34px -12px var(--c); animation: toastIn .6s cubic-bezier(.2, .9, .2, 1) both; }
.toast::before { content: ''; position: absolute; inset: 0; background: var(--c); opacity: 0; animation: tFlash .7s ease-out; pointer-events: none; }
.toast::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px); }
.toast.out { animation: toastOut .45s ease-in forwards; }
@keyframes toastIn {
  0% { opacity: 0; transform: translateX(-70px) skewX(-20deg); clip-path: inset(0 100% 0 0); filter: brightness(3); }
  30% { opacity: 1; transform: translateX(10px) skewX(5deg); clip-path: inset(0 0 0 0); filter: brightness(2.2); }
  40% { transform: translateX(-5px); clip-path: inset(18% 0 46% 0); }
  48% { transform: translateX(4px); clip-path: inset(58% 0 6% 0); }
  56% { transform: translateX(0); clip-path: inset(0 0 0 0); filter: brightness(1.3); }
  100% { transform: none; filter: none; }
}
@keyframes toastOut { to { opacity: 0; transform: translateX(50px); clip-path: inset(48% 0 48% 0); } }
@keyframes tFlash { 0% { opacity: .55; } 100% { opacity: 0; } }
.t-head { display: flex; align-items: baseline; gap: 9px; font: 700 12px var(--f-jp); letter-spacing: .14em; color: var(--c); }
.t-bolt { font-size: 14px; }
.t-month { font: 700 14px var(--f-disp); letter-spacing: .06em; color: #fff; text-shadow: 0 0 8px var(--c); }
.t-en { font: 600 8.5px var(--f-disp); letter-spacing: .25em; opacity: .7; }
.t-org { margin-left: auto; font: 700 10px var(--f-disp); letter-spacing: .2em; color: #fff; padding: 2px 7px; border: 1px solid var(--c); background: rgba(255, 255, 255, .04); }
.t-body { margin-top: 3px; font: 900 18px/1.3 var(--f-jp); color: #fff; text-shadow: 0 0 14px var(--c); letter-spacing: .02em; }
.t-bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--c); transform-origin: left; animation: tBar var(--life, 3.6s) linear forwards; box-shadow: 0 0 6px var(--c); }
@keyframes tBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* ---------- timeline ---------- */
#timeline { left: 16px; right: 16px; bottom: 14px; height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 22px 0 12px; animation-delay: 1.15s; }
.tb { flex: 0 0 auto; width: 42px; height: 40px; cursor: pointer; border: 1px solid rgba(61, 232, 255, .55); background: rgba(61, 232, 255, .09);
  color: var(--cyan); font: 700 14px var(--f-disp); text-shadow: 0 0 8px var(--cyan);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); transition: background .2s; }
.tb:hover { background: rgba(61, 232, 255, .24); }
.tb.sp { width: 46px; font-size: 12px; }
#tl-wrap { position: relative; flex: 1; height: 100%; margin-left: 8px; }
#tl-markers { position: absolute; left: 0; right: 0; top: 7px; height: 12px; }
.mk { position: absolute; top: 0; width: 9px; height: 9px; margin-left: -4.5px; padding: 0; cursor: pointer; transform: rotate(45deg);
  background: rgba(2, 6, 16, .9); border: 1.5px solid var(--c); opacity: .5; transition: opacity .3s, box-shadow .3s, background .3s; }
.mk.past { background: var(--c); opacity: 1; box-shadow: 0 0 8px var(--c); }
.mk:hover { opacity: 1; transform: rotate(45deg) scale(1.4); }
.mk[data-n]::after { content: attr(data-n); position: absolute; left: 7px; top: -9px; transform: rotate(-45deg); font: 400 8px var(--f-mono); color: rgba(220, 245, 255, .8); }
#tl-track { position: absolute; left: 0; right: 0; top: 23px; height: 16px; cursor: pointer; touch-action: none; }
#tl-track::before { content: ''; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: rgba(120, 200, 255, .2); }
#tl-ticks i { position: absolute; top: 5px; width: 1px; height: 6px; background: rgba(120, 200, 255, .28); }
#tl-ticks i.yr { top: -1px; height: 18px; background: rgba(120, 220, 255, .65); box-shadow: 0 0 4px rgba(61, 232, 255, .6); }
#tl-fill { position: absolute; left: 0; right: 0; top: 6px; height: 4px; transform-origin: left center; transform: scaleX(0);
  background: linear-gradient(90deg, rgba(40, 90, 255, .5), var(--cyan)); box-shadow: 0 0 10px var(--cyan); }
#tl-thumb { position: absolute; top: -3px; left: 0; width: 14px; height: 22px; margin-left: -7px; pointer-events: none; }
#tl-thumb::before { content: ''; position: absolute; inset: 0; background: #e9fdff; box-shadow: 0 0 12px var(--cyan); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
#tl-thumb::after { content: ''; position: absolute; left: -10px; right: -10px; top: 1px; bottom: 1px; border-radius: 50%; box-shadow: 0 0 18px 4px rgba(61, 232, 255, .55); }
#tl-label { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); padding: 1px 6px; white-space: nowrap; font: 400 11px var(--f-mono); color: #fff; background: rgba(3, 12, 28, .95); border: 1px solid rgba(61, 232, 255, .6); z-index: 2; }
#tl-years { position: absolute; left: 0; right: 0; top: 44px; height: 14px; }
#tl-years span { position: absolute; top: 0; padding-left: 4px; font: 600 9.5px var(--f-disp); letter-spacing: .12em; color: rgba(150, 220, 255, .65); }

/* ---------- boot ---------- */
#boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #01020a; pointer-events: none; animation: bootOut .7s ease 1.25s forwards; }
.b-logo { font: 900 54px/1 var(--f-disp); letter-spacing: .3em; color: #eaffff; text-shadow: 0 0 14px #3de8ff, 0 0 40px rgba(255, 61, 240, .5); animation: bootLogo 1.2s steps(6) both; }
.b-sub { font: 700 13px var(--f-jp); letter-spacing: .5em; color: rgba(61, 232, 255, .85); }
.b-bar { width: 260px; height: 2px; background: rgba(61, 232, 255, .15); overflow: hidden; }
.b-bar i { display: block; height: 100%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: bootBar 1.15s ease-out both; transform-origin: left; }
@keyframes bootBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes bootLogo { 0% { opacity: 0; letter-spacing: .6em; } 40% { opacity: .4; } 100% { opacity: 1; letter-spacing: .3em; } }
@keyframes bootOut { 0% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }

@media (max-width: 1100px) {
  #panel { width: 270px; }
  .row .nm small { display: none; }
  #legend { font-size: 10.5px; gap: 4px 14px; max-width: calc(100vw - 320px); }
  #toasts { width: 440px; }
  .t-body { font-size: 17px; }
}
@media (max-height: 720px) {
  .sec-h, #org-head, #org-list { display: none; }
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="fx-vignette"></div>
<div id="fx-scan"></div>
<div id="flash"></div>
<div id="glitch-band"></div>

<header id="title" class="hud">
  <div class="t-left">
    <div class="logo" data-text="AI WAR">AI WAR</div>
    <div class="sub">電脳戦況モニター<span>CYBER GALAXY / LIVE FEED</span></div>
  </div>
  <div class="t-date">
    <div class="t-cap">STARDATE<b id="month-prog">01/46</b></div>
    <div id="month" class="digits">2023.01</div>
  </div>
</header>

<div id="badge"><i></i>ダミーデータ（見た目確認用）</div>

<button id="back" type="button">◀ 銀河に戻る</button>
<div id="hint">▶ 惑星をクリックで戦線にズームイン</div>

<aside id="panel" class="hud">
  <div class="ph">
    <div class="ph-k">戦況ランキング<span>BATTLE RANKING</span></div>
    <div class="ph-row"><div id="pf-name" class="ph-t">総合戦線</div><div id="pf-en" class="ph-en">GENERAL FRONT</div></div>
    <div id="pf-stat" class="ph-stat"></div>
  </div>
  <div class="cols"><span>順位</span><span>部隊 / 陣営 ・ 強さ ・ 規模</span><span>前月比</span></div>
  <div id="rank-list"></div>
  <div id="rank-empty">― 未参戦 ―</div>
  <div class="sec-h">陣営展開<span>FLEET DEPLOYMENT</span></div>
  <div id="org-head" class="org-grid"></div>
  <div id="org-list"></div>
</aside>

<div id="legend" class="hud">
  <div class="lg"><i class="ic ic-area"></i><b>領土の広さ</b>＝規模（利用者・展開範囲）</div>
  <div class="lg"><i class="ic ic-glow"></i><b>輝き・攻勢</b>＝強さ（ベンチマーク＋レビュー）</div>
  <div class="lg"><i class="ic ic-spark"></i><b>火花</b>＝拮抗した前線</div>

  <button id="play" class="tb" type="button" title="再生 / 一時停止 (Space)">❚❚</button>
  <button id="speed" class="tb sp" type="button" title="再生速度">1x</button>
  <div id="tl-wrap">
    <div id="tl-markers"></div>
    <div id="tl-track">
      <div id="tl-ticks"></div>
      <div id="tl-fill"></div>
      <div id="tl-thumb"><span id="tl-label">2023.01</span></div>
    </div>
    <div id="tl-years"></div>
  </div>
</footer>

<div id="boot"><div class="b-logo">AI WAR</div><div class="b-sub">電脳戦況モニター ／ SYSTEM ONLINE</div><div class="b-bar"><i></i></div></div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  /* ==================================================================
   * 0. UTILITIES
   * ================================================================== */
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const mod = (a, n) => ((a % n) + n) % n;
  const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  const RGB = Object.create(null);
  function rgbOf(hex) {
    let v = RGB[hex];
    if (!v) {
      const n = parseInt(String(hex).slice(1, 7), 16) || 0;
      v = RGB[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    return v;
  }
  function rgba(hex, a) {
    const c = rgbOf(hex);
    a = a > 0 ? (a < 1 ? a : 1) : 0; // NaN-safe
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(3) + ')';
  }
  const MIX = Object.create(null);
  function mixHex(h1, h2, t) {
    t = Math.round(clamp(t, 0, 1) * 8) / 8; // quantized → bounded cache
    const key = h1 + h2 + t;
    let v = MIX[key];
    if (!v) {
      const a = rgbOf(h1), b = rgbOf(h2);
      const r = Math.round(lerp(a[0], b[0], t)), g = Math.round(lerp(a[1], b[1], t)), bl = Math.round(lerp(a[2], b[2], t));
      v = MIX[key] = '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
    }
    return v;
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function strHash(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (((h >>> 0) % 10000) / 10000) * TAU;
  }
  function mulberry(seed) {
    let t = seed >>> 0;
    return () => {
      t += 0x6d2b79f5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function setText(el, s) { if (el._t !== s) { el._t = s; el.textContent = s; } }
  function setStyle(el, prop, v) { const k = '_s_' + prop; if (el[k] !== v) { el[k] = v; el.style[prop] = v; } }
  const $ = (id) => document.getElementById(id);

  /* ==================================================================
   * 1. DATA ACCESS
   * ================================================================== */
  const D = window.AIWAR;
  if (!D) {
    $('boot').innerHTML = '<div class="b-sub">data.js を読み込めませんでした</div>';
    return;
  }
  const MONTHS = D.months;
  const LAST = MONTHS.length - 1;
  const SECTORS = D.sectors;
  const SECTOR_IDS = SECTORS.map((s) => s.id);
  const SEC = {};
  SECTORS.forEach((s) => { SEC[s.id] = s; });
  const ORDER = {};
  SECTOR_IDS.forEach((id) => { ORDER[id] = Object.keys(D.units[id] || {}); });
  const SHORT = { general: '総', code: 'コ', image: '画', video: '動', music: '音' };
  const orgName = (o) => (D.orgs[o] ? D.orgs[o].name : o);
  const orgColor = (o) => (D.orgs[o] ? D.orgs[o].color : '#3de8ff');
  const monthIdx = (fi) => clamp(Math.floor(fi + 1e-6), 0, LAST);
  const monthText = (fi) => MONTHS[monthIdx(fi)].replace('-', '.');
  const EVENTS_BY_MONTH = {};
  D.events.forEach((e) => { if (e.i >= 0) (EVENTS_BY_MONTH[e.i] = EVENTS_BY_MONTH[e.i] || []).push(e); });

  // 固定順（ユニット定義順）でその時点の勢力を取得 → 領土の並びが時間で入れ替わらず滑らかに変形する
  function sampleSector(sid, fi) {
    const list = [];
    for (const uid of ORDER[sid]) {
      const v = D.at(sid, uid, fi);
      if (v && v.c > 0.1) {
        const u = D.units[sid][uid];
        list.push({ id: uid, name: u.name, org: u.org, color: u.color, s: v.s, c: v.c, share: 0, k: 0, a0: 0, a1: 0, span: 0, bright: 0 });
      }
    }
    let tot = 0;
    for (const u of list) tot += u.c;
    for (const u of list) u.share = u.c / (tot || 1);
    return list;
  }

  /* ==================================================================
   * 2. STATE
   * ================================================================== */
  const SEC_PER_MONTH = 0.7;
  const SPEEDS = [1, 2, 4];
  const BOOT_DELAY = 1.7; // 起動演出の後に再生開始
  const state = {
    fi: 0, lastFi: 0, playing: true, speed: 1, dragging: false, jumpFlag: false,
    focus: null, lastFocus: null, hover: null,
    time: 0, warpV: 0, zOv: 1, hexFlick: 0,
  };

  /* ==================================================================
   * 3. CANVAS / VIEW / CAMERA
   * ================================================================== */
  const cv = $('cv');
  const ctx = cv.getContext('2d');
  const hasLS = 'letterSpacing' in ctx;
  const hasConic = typeof ctx.createConicGradient === 'function';
  let W = 1, H = 1, DPR = 1;
  const view = { x: 0, y: 0, w: 1, h: 1, cx: 0, cy: 0 };
  const cam = { x: 0, y: 0, z: 1 };
  let tween = null;
  const SX = (x) => view.cx + (x - cam.x) * cam.z;
  const SY = (y) => view.cy + (y - cam.y) * cam.z;

  const panelEl = $('panel'), legendEl = $('legend'), toastsEl = $('toasts');
  function computeView() {
    const pr = panelEl.getBoundingClientRect();
    const lr = legendEl.getBoundingClientRect();
    const right = pr.width > 0 && pr.left > W * 0.4 ? pr.left - 14 : W - 14;
    const bottom = (lr.height > 0 ? lr.top : H - 90) - 8;
    view.x = 14; view.y = 92;
    view.w = Math.max(240, right - view.x);
    view.h = Math.max(200, bottom - view.y);
    view.cx = view.x + view.w / 2;
    view.cy = view.y + view.h / 2;
    // 操作ヒントはタイトルとバッジの間へ（惑星ラベルと重ならない位置）
    const hint = $('hint'), tr = $('title').getBoundingClientRect(), br = $('badge').getBoundingClientRect();
    hint.classList.remove('nospace');
    hint.style.left = Math.round(tr.right + 22) + 'px';
    if (tr.right + 22 + hint.offsetWidth > br.left - 12) hint.classList.add('nospace');
    // 告知バナーは主戦場（中央惑星）を隠さないよう、ビュー下端に積み上げる
    toastsEl.style.left = view.cx + 'px';
    toastsEl.style.bottom = Math.round(H - (view.y + view.h) + 4) + 'px';
    toastsEl.style.width = Math.min(520, view.w - 30) + 'px';
  }

  function overviewTarget() { return { x: 8, y: 0, z: Math.min(view.w / 960, view.h / 590) }; }
  function focusTarget(sid) { const p = P[sid]; return { x: p.x, y: p.y + p.r * 0.06, z: (0.36 * Math.min(view.w, view.h)) / p.r }; }
  function camTarget() { return state.focus ? focusTarget(state.focus) : overviewTarget(); }
  function startTween(dur) { tween = { fx: cam.x, fy: cam.y, fz: cam.z, t: 0, dur }; }
  // ズーム中、注目点が画面上を直線的に移動するように補間（対数ズーム＋スクリーン座標補間）
  function updateCam(dt) {
    const T = camTarget();
    const lz0 = Math.log(cam.z);
    if (tween) {
      tween.t += dt / tween.dur;
      const e = easeInOutCubic(clamp(tween.t, 0, 1));
      cam.z = Math.exp(lerp(Math.log(tween.fz), Math.log(T.z), e));
      const k = (tween.fz * (1 - e)) / cam.z;
      cam.x = T.x - (T.x - tween.fx) * k;
      cam.y = T.y - (T.y - tween.fy) * k;
      if (tween.t >= 1) tween = null;
    } else {
      cam.x = T.x; cam.y = T.y; cam.z = T.z;
    }
    const v = dt > 0 ? (Math.log(cam.z) - lz0) / dt : 0;
    state.warpV = lerp(state.warpV, v, 0.25);
  }
  function computeDetailAmt() {
    const f = state.lastFocus;
    if (!f) return 0;
    const zF = focusTarget(f).z, zO = state.zOv;
    if (zF <= zO * 1.01) return state.focus ? 1 : 0;
    return clamp(Math.log(cam.z / zO) / Math.log(zF / zO), 0, 1);
  }

  /* ==================================================================
   * 4. WORLD MODEL — planets / territories / frontlines
   * ================================================================== */
  const LAYOUT = {
    general: { x: 0, y: 0, r: 138, ph: 0.0 },
    code:    { x: -368, y: -150, r: 66, ph: 1.3 },
    image:   { x: 356, y: -168, r: 66, ph: 2.6 },
    video:   { x: 382, y: 152, r: 66, ph: 3.9 },
    music:   { x: -346, y: 172, r: 56, ph: 5.1 },
  };
  const CORE = 0.17;      // 中心コア半径（惑星半径比）
  const RHO_MAX = 1.04;   // 境界線サンプルの外端（クリップで縁に揃う）
  const TILT = -0.28;     // リング・軌道の傾き

  const planets = SECTOR_IDS.map((id, i) => {
    const L = LAYOUT[id] || { x: Math.cos(i * 1.3) * 380, y: Math.sin(i * 1.3) * 180, r: 60, ph: i };
    return {
      id, sec: SEC[id], big: id === 'general',
      bx: L.x, by: L.y, r: id === 'general' ? L.r : L.r, ph: L.ph,
      x: L.x, y: L.y, rot: L.ph * 1.1 - Math.PI / 2, rotSpeed: (i % 2 ? -1 : 1) * 0.016,
      units: [], idx: {}, n: 0, lead: null, atm: '#3cc8ff',
      borders: [], bmap: new Map(), hot: 0, pulse: {},
      sx: 0, sy: 0, sr: 1, NS: 16,
    };
  });
  const P = {};
  planets.forEach((p) => { P[p.id] = p; });
  const HUB = P.general || planets[0];

  function updatePlanetModel(p, dt) {
    const t = state.time;
    p.x = p.bx + Math.sin(t * 0.31 + p.ph) * 5;
    p.y = p.by + Math.cos(t * 0.23 + p.ph * 1.7) * 6;
    p.rot += p.rotSpeed * dt;
    const units = sampleSector(p.id, state.fi);
    p.units = units; p.n = units.length; p.idx = {};
    let a = p.rot;
    units.forEach((u, k) => {
      p.idx[u.id] = k; u.k = k;
      u.a0 = a; u.span = u.share * TAU; a += u.span; u.a1 = a;
      u.bright = clamp((u.s - 50) / 45, 0.06, 1);
    });
    let lead = null, best = -1;
    for (const u of units) { const pw = u.s * 0.6 + u.c * 0.4; if (pw > best) { best = pw; lead = u; } }
    p.lead = lead;
    p.atm = lead ? mixHex(lead.color, '#3cc8ff', 0.55) : '#3c78c8';
    for (const k in p.pulse) p.pulse[k] = Math.max(0, p.pulse[k] - dt * 0.55);
  }

  // 境界線の角度：ノイズで揺らぎ、強い側が弱い側へ押し込む（膨らむ）
  function borderAngle(b, rho) {
    const t = state.time;
    const rp = clamp((rho - CORE) / (1 - CORE), 0, 1);
    const wob = 0.024 * (Math.sin(rho * 9 + t * 1.3 + b.seed) + 0.6 * Math.sin(rho * 17 - t * 2.1 + b.seed * 2.3) +
      0.35 * Math.sin(rho * 33 + t * 3.7 + b.seed * 0.7)) * smoothstep(0, 0.2, rp);
    const pushD = b.push * 0.12 * Math.sin(Math.PI * rp * 0.85) * (0.85 + 0.15 * Math.sin(t * 1.7 + b.seed));
    const off = clamp((wob + pushD) / Math.max(rho, 0.22), -b.maxL, b.maxR);
    return b.base + off;
  }

  function updatePlanetGeometry(p) {
    p.sx = SX(p.x); p.sy = SY(p.y); p.sr = p.r * cam.z;
    p.NS = p.sr > 220 ? 30 : p.sr > 110 ? 22 : 14;
    p.borders.length = 0; p.hot = 0;
    const units = p.units, n = p.n;
    if (n < 2) return;
    for (let k = 0; k < n; k++) {
      const prev = units[(k - 1 + n) % n], cur = units[k];
      const key = prev.id + '|' + cur.id;
      let b = p.bmap.get(key);
      if (!b) {
        b = { seed: strHash(key), acc: Math.random(), boom: Math.random(), ang: new Float32Array(31), px: new Float32Array(31), py: new Float32Array(31) };
        p.bmap.set(key, b);
      }
      const ds = prev.s - cur.s;
      b.k = k; b.prev = prev; b.cur = cur; b.base = cur.a0;
      b.push = clamp(ds / 10, -1, 1);                 // + → prev が cur 側へ押し込む
      b.fierce = clamp(1 - Math.abs(ds) / 14, 0.12, 1); // 強さが拮抗するほど激戦
      b.maxL = prev.span * 0.42; b.maxR = cur.span * 0.42;
      if (b.fierce > 0.75) p.hot++;
      for (let i = 0; i <= p.NS; i++) {
        const rho = CORE + ((RHO_MAX - CORE) * i) / p.NS;
        const a = borderAngle(b, rho);
        b.ang[i] = a;
        b.px[i] = p.sx + Math.cos(a) * rho * p.sr;
        b.py[i] = p.sy + Math.sin(a) * rho * p.sr;
      }
      p.borders.push(b);
    }
  }

  function unitAngleRange(p, k, rho) {
    if (p.n < 2) return [p.rot, p.rot + TAU];
    const bs = p.borders[k], be = p.borders[(k + 1) % p.n];
    const wrap = k === p.n - 1 ? TAU : 0;
    return [borderAngle(bs, rho), borderAngle(be, rho) + wrap];
  }

  function territoryPath(p, k) {
    const path = new Path2D();
    const cx = p.sx, cy = p.sy, R = p.sr;
    if (p.n === 1) {
      path.arc(cx, cy, R * RHO_MAX, 0, TAU);
      path.moveTo(cx + R * CORE, cy);
      path.arc(cx, cy, R * CORE, 0, TAU);
      return path;
    }
    const n = p.n, NS = p.NS, bs = p.borders[k], be = p.borders[(k + 1) % n];
    const wrap = k === n - 1 ? TAU : 0;
    path.moveTo(bs.px[0], bs.py[0]);
    for (let i = 1; i <= NS; i++) path.lineTo(bs.px[i], bs.py[i]);
    path.arc(cx, cy, R * RHO_MAX, bs.ang[NS], be.ang[NS] + wrap, false);
    for (let i = NS; i >= 0; i--) path.lineTo(be.px[i], be.py[i]);
    path.arc(cx, cy, R * CORE, be.ang[0] + wrap, bs.ang[0], true);
    path.closePath();
    return path;
  }

  function territoryCentroid(p, u) {
    if (!u || p.n < 2) return { x: p.x, y: p.y - (p.n ? p.r * 0.4 : 0) };
    const am = (u.a0 + u.a1) / 2;
    return { x: p.x + Math.cos(am) * p.r * 0.6, y: p.y + Math.sin(am) * p.r * 0.6 };
  }
  const onScreen = (p, m) => {
    const e = p.sr * (m || 1.7);
    return p.sx + e > 0 && p.sx - e < W && p.sy + e > 0 && p.sy - e < H;
  };

  /* ==================================================================
   * 5. OFFSCREEN ASSETS — nebula / hex / galaxy disc / glow sprites / stars
   * ================================================================== */
  const neb = document.createElement('canvas');
  function buildNebula() {
    const w = Math.max(64, Math.ceil(W / 2.5)), h = Math.max(64, Math.ceil(H / 2.5));
    neb.width = w; neb.height = h;
    const g = neb.getContext('2d');
    const R = mulberry(20260);
    g.fillStyle = '#02030a'; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'lighter';
    const cols = ['88,40,200', '24,110,210', '190,40,170', '20,160,190', '60,50,170', '140,30,120'];
    const M = Math.max(w, h);
    for (let i = 0; i < 24; i++) {
      const x = R() * w, y = R() * h, r = (0.1 + R() * 0.42) * M;
      const c = cols[i % cols.length], a = 0.05 + R() * 0.14;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(' + c + ',' + a + ')');
      gr.addColorStop(0.5, 'rgba(' + c + ',' + a * 0.4 + ')');
      gr.addColorStop(1, 'rgba(' + c + ',0)');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    }
    g.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 12; i++) {
      const x = R() * w, y = R() * h, r = (0.05 + R() * 0.18) * M;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(0,0,6,0.38)'); gr.addColorStop(1, 'rgba(0,0,6,0)');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    }
  }

  const hexc = document.createElement('canvas');
  function buildHex() {
    hexc.width = Math.ceil(W * DPR); hexc.height = Math.ceil(H * DPR);
    const g = hexc.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const s = 22, hw = Math.sqrt(3) * s;
    const rows = Math.ceil(H / (1.5 * s)) + 2, cols = Math.ceil(W / hw) + 2;
    g.strokeStyle = 'rgba(110,210,255,1)'; g.lineWidth = 0.6;
    g.beginPath();
    for (let r = -1; r < rows; r++) {

  }

  const gal = document.createElement('canvas');
  function buildGalaxy() {
    const S = 1024, C = S / 2;
    gal.width = gal.height = S;
    const g = gal.getContext('2d');
    const R = mulberry(777);
    g.globalCompositeOperation = 'lighter';
    let gr = g.createRadialGradient(C, C, 0, C, C, 270);
    gr.addColorStop(0, 'rgba(255,230,255,0.5)'); gr.addColorStop(0.12, 'rgba(200,140,255,0.32)');
    gr.addColorStop(0.45, 'rgba(90,60,220,0.11)'); gr.addColorStop(1, 'rgba(30,20,120,0)');
    g.fillStyle = gr; g.fillRect(0, 0, S, S);

    const ARMS = 3;
    for (let i = 0; i < 320; i++) {
      const arm = i % ARMS, t = Math.pow(R(), 0.85);
      const ang = (arm * TAU) / ARMS + t * 5.4 + (R() - 0.5) * 0.5;
      const rr = 50 + t * 430, x = C + Math.cos(ang) * rr, y = C + Math.sin(ang) * rr;
      const rad = (20 + R() * 50) * (1.1 - t * 0.5);
      const c = armCols[(arm + (R() < 0.3 ? 1 : 0)) % 3], a = 0.035 + R() * 0.05;

      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    for (let i = 0; i < 3800; i++) {
      const arm = i % ARMS, t = Math.pow(R(), 0.7);

      const rr = 30 + t * 470 + (R() - 0.5) * 30;

  }

  let dotPattern = null;
  function buildDots() {
    const s = Math.max(4, Math.round(6 * DPR));

  const glowCache = Object.create(null);

  const STAR_LAYERS = [

    { k: 0.035, zk: 0.12, n: 150, s0: 0.8, s1: 1.5, cols: ['rgba(170,200,255,0.5)', 'rgba(230,240,255,0.8)'] },
    { k: 0.08, zk: 0.24, n: 60, s0: 1.2, s1: 2.0, cols: ['rgba(190,220,255,0.7)', 'rgba(255,255,255,0.95)'] },
  ];
  let stars = [], twinkles = [];
  function seedStars() {
    const R = mulberry(4242);

    stars = STAR_LAYERS.map((L) => {
      const n = Math.round(L.n * area), arr = [[], []];

  /* ==================================================================
   * 6. SIMULATION — sparks / fx / ships / data streams / fleets
   * ================================================================== */
  // ---- sparks (world coords) ----
  const parts = [];
  const MAX_PARTS = 520;
  function spark(x, y, vx, vy, life, color, w) {
    if (parts.length < MAX_PARTS) parts.push({ x, y, vx, vy, life, max: life, color, w });
  }
  function updateParts(dt) {
    const d = 1 - Math.min(1, dt * 2.6);
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      q.life -= dt;
      if (q.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= d; q.vy *= d;
    }
  }
  function burst(x, y, color, n, speed, life) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = (rand(0.3, 1) * speed) / cam.z;
      spark(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.5, 1) * life, Math.random() < 0.3 ? '#ffffff' : color, rand(1, 2.4));
    }
  }

  // ---- fx (flash / ring / beam / laser / label) ----
  const fxs = [];
  function addFx(o) { if (fxs.length < 170) { o.t = 0; fxs.push(o); } }

  // ---- frontline sparks & explosions ----
  function emitBorderSparks(p, dt) {
    if (p.n < 2 || !onScreen(p)) return;
    const sizeF = clamp(p.sr / 140, 0.15, 2.2);
    for (const b of p.borders) {
      b.acc += (1.5 + 22 * b.fierce * b.fierce) * sizeF * dt;
      while (b.acc >= 1) { b.acc -= 1; borderSpark(p, b, sizeF); }
      b.boom += (0.12 + 0.9 * b.fierce) * Math.sqrt(sizeF) * dt;
      if (b.boom >= 1) { b.boom = -Math.random() * 0.8; borderBoom(p, b, sizeF); }
    }
  }
  function borderSpark(p, b, sizeF) {
    const rho = rand(CORE + 0.05, 0.99), ang = borderAngle(b, rho);
    const x = p.x + Math.cos(ang) * rho * p.r, y = p.y + Math.sin(ang) * rho * p.r;
    const dir = Math.random() < 0.5 + 0.38 * b.push ? 1 : -1; // 主に弱い側へ飛ぶ＝押し込み
    const tx = -Math.sin(ang) * dir, ty = Math.cos(ang) * dir;
    const sp = (rand(25, 120) / cam.z) * Math.sqrt(sizeF), j = rand(-0.9, 0.9);

  function borderBoom(p, b, sizeF) {

    const col = Math.random() < 0.5 ? b.prev.color : b.cur.color;
    const sz = rand(9, 20) * Math.sqrt(sizeF);
    addFx({ type: 'flash', x, y, size: sz, color: col, dur: rand(0.35, 0.6) });
    addFx({ type: 'ring', x, y, r0: 2, r1: sz * 1.7, color: col, dur: 0.5, w: 1.5 });
    burst(x, y, col, 6 + Math.floor(Math.random() * 6), 110 * Math.sqrt(sizeF), 0.6);
  }

  // ---- arrival (warp-in) / event strike ----
  const presence = {};
  SECTOR_IDS.forEach((s) => { presence[s] = {}; });
  function checkArrivals(jump) {
    for (const p of planets) {
      const pres = presence[p.id];
      for (const uid of ORDER[p.id]) {
        const k = p.idx[uid];
        const is = k !== undefined;
        if (is && !pres[uid] && !jump) arrive(p, p.units[k]);
        pres[uid] = is;
      }
    }
  }
  function arrive(p, u) {
    const c = territoryCentroid(p, u);
    addFx({ type: 'beam', x: c.x, y: c.y, color: u.color, dur: 1.4 });
    addFx({ type: 'ring', x: c.x, y: c.y, r0: 3, r1: 40 + p.sr * 0.5, color: u.color, dur: 1.1, w: 3 });
    addFx({ type: 'flash', x: c.x, y: c.y, size: 34 + p.sr * 0.15, color: u.color, dur: 0.9 });
    addFx({ type: 'label', x: c.x, y: c.y, text: u.name + ' 参戦', sub: 'WARP IN', color: u.color, dur: 2.2 });

    burst(c.x, c.y, u.color, 16, 160, 0.8);
  }
  function eventStrike(e, color) {
    const p = P[e.sector];
    if (!p) return;
    p.pulse[e.unit] = 1;
    const k = p.idx[e.unit];
    const c = territoryCentroid(p, k !== undefined ? p.units[k] : null);
    addFx({ type: 'beam', x: c.x, y: c.y, color, dur: 1.1 });
    addFx({ type: 'ring', x: c.x, y: c.y, r0: 4, r1: p.sr * 0.9 + 40, color, dur: 1.2, w: 4 });
    addFx({ type: 'ring', x: p.x, y: p.y, r0: p.sr, r1: p.sr * 1.75, color, dur: 1.5, w: 2 });
    addFx({ type: 'flash', x: c.x, y: c.y, size: 60, color, dur: 0.8 });
