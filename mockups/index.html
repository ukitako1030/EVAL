<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI WAR — 見た目案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#05070d; --line:#1d2a44; --text:#cfe0ff; --dim:#6f82a8; --accent:#33e1ff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% 0%, #0d1830 0%, var(--bg) 60%); color:var(--text);
         font-family:'Noto Sans JP', system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; padding:48px 16px; }
  h1 { font-family:'Orbitron', sans-serif; font-weight:800; letter-spacing:.2em; font-size:44px; margin:0;
       text-shadow:0 0 18px rgba(51,225,255,.6); }
  .sub { color:var(--dim); margin:8px 0 40px; letter-spacing:.1em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:20px; width:100%; max-width:980px; }
  a.card { position:relative; display:block; padding:24px; border:1px solid var(--line); background:rgba(10,18,34,.7);
           color:inherit; text-decoration:none; transition:border-color .2s, transform .2s, box-shadow .2s; }
  a.card:hover { border-color:var(--accent); transform:translateY(-3px); box-shadow:0 0 24px rgba(51,225,255,.25); }
  a.card::before, a.card::after { content:''; position:absolute; width:12px; height:12px; border:2px solid var(--accent); }
  a.card::before { top:-1px; left:-1px; border-right:none; border-bottom:none; }
  a.card::after { bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .tag { font-family:'Orbitron', sans-serif; color:var(--accent); font-size:13px; letter-spacing:.2em; }
  .name { font-size:22px; font-weight:700; margin:6px 0 10px; }
  .desc { color:var(--dim); font-size:14px; line-height:1.7; }
  .note { margin-top:36px; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
  <h1>AI WAR</h1>
  <div class="sub">電脳戦況モニター — 見た目の方向性 3案（ダミーデータ）</div>
  <div class="grid">
    <a class="card" href="a-galaxy.html">
      <div class="tag">DIRECTION A</div>
      <div class="name">電脳銀河</div>
      <div class="desc">中央の巨大な「総合」惑星と、周回する部門惑星。惑星の表面を各軍が奪い合い、艦隊が星間を行き来する。クリックで惑星にズーム。</div>
    </a>
    <a class="card" href="b-hex.html">
      <div class="tag">DIRECTION B</div>
      <div class="name">ネオングリッド制圧戦</div>
      <div class="desc">ヘックスタイルの大陸と島々。陣取りゲームのように国境のマスが1つずつ塗り替わっていく戦略マップ。</div>
    </a>
    <a class="card" href="c-swarm.html">
      <div class="tag">DIRECTION C</div>
      <div class="name">粒子大戦</div>
      <div class="desc">各軍が何千もの光の粒子の群れとして動き回り、ぶつかり合う。映画的・アート寄りの見せ方。</div>
    </a>
  </div>
  <div class="note">各ページ下のタイムラインで、2023年から現在までの戦況を再生・スクラブできます。</div>
</body>
</html>
